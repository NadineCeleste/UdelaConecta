# Producción en VPS (DuckDNS + Caddy + FastAPI + PostgreSQL):
#   infra/vps/setup-env.sh   # genera infra/vps/.env.vps
#   infra/vps/deploy.sh      # o npm run vps:up
name: udela-vps

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
  STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
  PUBLIC_STORAGE_BASE_URL: ${PUBLIC_STORAGE_BASE_URL:-/storage}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
  AUTO_SEED: ${AUTO_SEED:-false}

services:
  duckdns:
    image: caddy:2-alpine
    container_name: udela-vps-duckdns
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:?Falta DUCKDNS_SUBDOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?Falta DUCKDNS_TOKEN}
    command:
      - sh
      - -c
      - |
        DOM="$${DUCKDNS_SUBDOMAIN%.duckdns.org}"
        while true; do
          RES=$$(wget -qO- "https://www.duckdns.org/update?domains=$${DOM}&token=$${DUCKDNS_TOKEN}&ip=" || echo "ERROR")
          echo "[$$(date -Iseconds)] DuckDNS ($${DOM}.duckdns.org): $${RES}"
          if [ "$${RES}" = "OK" ]; then
            touch /tmp/duckdns_ok
          else
            rm -f /tmp/duckdns_ok
          fi
          sleep 300
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/duckdns_ok"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - udela_vps_net

  # Caddy sirve el build de Angular y hace de proxy hacia el backend (Caddyfile incluido en la imagen)
  caddy:
    build:
      context: ../..
      dockerfile: infra/vps/Dockerfile.caddy
    container_name: udela-vps-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    # Si el servidor ya tiene un proxy en 80/443, se publica solo en 127.0.0.1 (ver .env.vps.example)
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      duckdns:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - udela_vps_net

  backend:
    build:
      context: ../..
      dockerfile: infra/vps/Dockerfile.backend
    container_name: udela-vps-backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - udela_vps_net

  postgres:
    image: postgres:16-alpine
    container_name: udela-vps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
    # Sin "ports": la base solo es accesible dentro de la red interna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - udela_vps_net

networks:
  udela_vps_net:
    driver: bridge

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
