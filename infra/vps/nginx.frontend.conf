server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre: caché larga
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea para que los deploys se vean al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida vuelve a index.html (router de Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
