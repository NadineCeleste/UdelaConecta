# Desarrollo local 100% en Docker:
#   Puertos del host configurables con POSTGRES_HOST_PORT, FRONTEND_PORT, ADMINER_PORT y N8N_HOST_PORT
#   npm run local:up   (o: docker compose -f infra/local/docker-compose.yml --env-file infra/local/.env.local up -d --build)
name: udela-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: udela-local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo desde la máquina local: la contraseña de desarrollo es conocida
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.backend.dev
    container_name: udela-local-backend
    env_file:
      - .env.local
      # Opcional y fuera de git: permite apuntar a otro n8n y cargar el secreto del chat.
      # Las variables de este archivo pisan a las de .env.local.
      - path: .env.chat
        required: false
    environment:
      # El front corre en el puerto publicado de abajo: se habilita ese origen en CORS
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-4200},http://127.0.0.1:${FRONTEND_PORT:-4200}
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/backend:/app
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.frontend.dev
    container_name: udela-local-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ../..:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:2.43.7
    container_name: udela-local-n8n
    ports:
      # Solo desde la máquina local; la UI de n8n queda en http://localhost:5678
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-udela-local-n8n-key}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n:/workflows:ro
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    container_name: udela-local-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  storage:
  frontend_node_modules:
  n8n_data:
