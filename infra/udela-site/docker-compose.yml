name: udela-site

services:
  caddy:
    build:
      context: ../..
      dockerfile: infra/vps/Dockerfile.caddy
    container_name: udela-site-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ":80"
    ports:
      - "8083:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - udela_site_net

  backend:
    build:
      context: ../..
      dockerfile: infra/vps/Dockerfile.backend
    container_name: udela-site-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - udela_site_net

  postgres:
    image: postgres:16-alpine
    container_name: udela-site-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - udela_site_net

networks:
  udela_site_net:
    driver: bridge

volumes:
  pgdata:
  storage:
