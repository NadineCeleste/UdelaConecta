# Producción en VPS (DuckDNS + Caddy + FastAPI + PostgreSQL):
#   infra/vps/setup-env.sh   # genera infra/vps/.env.vps
#   infra/vps/deploy.sh      # o npm run vps:up
name: udela-vps

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
  STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
  PUBLIC_STORAGE_BASE_URL: ${PUBLIC_STORAGE_BASE_URL:-/storage}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
  AUTO_SEED: ${AUTO_SEED:-false}
  # n8n: el servicio de abajo (perfil "n8n", URLs http://n8n:5678/...) o uno externo.
  # Sin URL o sin secreto, el chat responde 503 y la orientación usa el fallback sin IA
  N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-}
  N8N_CHAT_SECRET: ${N8N_CHAT_SECRET:-}
  N8N_CHAT_TIMEOUT_SEGUNDOS: ${N8N_CHAT_TIMEOUT_SEGUNDOS:-60}
  CHAT_DATOS_URL: ${CHAT_DATOS_URL:-}
  CHAT_TOKEN_MINUTOS: ${CHAT_TOKEN_MINUTOS:-5}
  # Orientación de postulación y digest semanal (mismo header X-Udela-Secret)
  N8N_ORIENTACION_WEBHOOK_URL: ${N8N_ORIENTACION_WEBHOOK_URL:-}
  N8N_AUTOMATION_SECRET: ${N8N_AUTOMATION_SECRET:-}
  N8N_ORIENTACION_TIMEOUT_SEGUNDOS: ${N8N_ORIENTACION_TIMEOUT_SEGUNDOS:-30}

services:
  duckdns:
    image: caddy:2-alpine
    container_name: udela-vps-duckdns
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:?Falta DUCKDNS_SUBDOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?Falta DUCKDNS_TOKEN}
    command:
      - sh
      - -c
      - |
        DOM="$${DUCKDNS_SUBDOMAIN%.duckdns.org}"
        while true; do
          RES=$$(wget -qO- "https://www.duckdns.org/update?domains=$${DOM}&token=$${DUCKDNS_TOKEN}&ip=" || echo "ERROR")
          echo "[$$(date -Iseconds)] DuckDNS ($${DOM}.duckdns.org): $${RES}"
          if [ "$${RES}" = "OK" ]; then
            touch /tmp/duckdns_ok
          else
            rm -f /tmp/duckdns_ok
          fi
          sleep 300
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/duckdns_ok"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - udela_vps_net

  # Caddy sirve el build de Angular y hace de proxy hacia el backend (Caddyfile incluido en la imagen)
  caddy:
    build:
      context: ../..
      dockerfile: infra/vps/Dockerfile.caddy
    container_name: udela-vps-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    # Si el servidor ya tiene un proxy en 80/443, se publica solo en 127.0.0.1 (ver .env.vps.example)
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      duckdns:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - udela_vps_net

  backend:
    build:
      context: ../..
      dockerfile: infra/vps/Dockerfile.backend
    container_name: udela-vps-backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - udela_vps_net

  postgres:
    image: postgres:16-alpine
    container_name: udela-vps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
    # Sin "ports": la base solo es accesible dentro de la red interna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - udela_vps_net

  # Workflows del asistente, la orientación y el digest (infra/n8n). El backend lo llama por
  # http://n8n:5678 y n8n lee el backend por http://backend:3000: nada pasa por Internet.
  # Solo arranca con COMPOSE_PROFILES=n8n en .env.vps (si el servidor ya tiene su propio n8n, no hace falta).
  # El editor se publica solo en 127.0.0.1; se entra con un túnel SSH (ver orquestacion.md)
  n8n:
    image: n8nio/n8n:2.43.7
    profiles: ["n8n"]
    container_name: udela-vps-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      # Cifra las credenciales guardadas en n8n: si se pierde, hay que volver a cargarlas.
      # No usa ":?" porque compose lo exigiría aun con el perfil apagado; deploy.sh la genera si falta
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # El editor se usa por túnel SSH en http://localhost
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n:/workflows:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - udela_vps_net

networks:
  udela_vps_net:
    driver: bridge

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
  n8n_data:
